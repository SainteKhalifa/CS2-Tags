name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_PATH: "CS2-Tags.csproj"
  PROJECT_NAME: "CS2-Tags"
  OUTPUT_PATH: "./CS2-Tags"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -c Release -o ${{ env.OUTPUT_PATH }}

    # L'API CounterStrikeSharp est déjà fournie par le serveur
    - name: Clean files
      run: rm -f ${{ env.OUTPUT_PATH }}/CounterStrikeSharp.API.*

    - name: Zip
      if: github.event_name != 'pull_request'
      run: zip -r ${{ env.PROJECT_NAME }}.zip ${{ env.OUTPUT_PATH }}

    # Une release par push sur main (ou lancement manuel), avec le zip du plugin
    - name: Release
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        VERSION=$(grep -oP 'ModuleVersion => "\K[^"]+' CS2-Tags.cs)
        TAG="v${VERSION}-build.${RUN_NUMBER}"
        {
          echo "CS2-Tags ${VERSION}, compilé pour CounterStrikeSharp 1.0.375 (.NET 10)."
          echo
          echo "Installation : extraire le dossier CS2-Tags du zip dans game/csgo/addons/counterstrikesharp/plugins/"
          echo "Le fichier tags.json n'est pas inclus : il est créé au premier démarrage s'il n'existe pas, et votre configuration est conservée lors d'une mise à jour."
          if [ -n "$COMMIT_MESSAGE" ]; then
            echo
            echo "Changements :"
            echo "$COMMIT_MESSAGE"
          fi
        } > release-notes.md
        gh release create "$TAG" "${PROJECT_NAME}.zip" --target "$GITHUB_SHA" --title "CS2-Tags ${VERSION} (build ${RUN_NUMBER})" --notes-file release-notes.md
